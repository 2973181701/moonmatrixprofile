name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.14
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: node scripts/verify.mjs
      - name: STUMPY oracle
        run: |
          python -m pip install -r requirements-validation.txt
          python scripts/validate_stumpy.py
